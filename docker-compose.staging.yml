# Staging — misma app stateless (1 réplica). Escale `app` cuando haga falta.
#
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up --build
#
# Criterios de rampa (k6): login no 5xx, dashboard p95 < 2s, RAM de Next.js
# no crece con el tamaño de los PDF (subida directa a MinIO).

services:
  app:
    deploy:
      replicas: 1
    environment:
      NODE_ENV: production
      STORAGE_DRIVER: s3
      API_RATE_MAX: "300"

  worker:
    environment:
      JOB_CONCURRENCY: "8"
